version: '3.7'

services:
  nginx_app:
      container_name: nginx_app
      build:
        context: ./nginx
        dockerfile: Dockerfile
      ports:
        - 80:80
      restart: always
  node_app:
    container_name: node_app
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: always
    expose:
      - 4000
    ports:
      - "4000:4000"
    links:
      - mongo_db
    env_file: ./server/.env
  mongo_db:
    container_name: mongo_db
    image: mongo
    volumes:
      - mongo_volume:/data/db
    expose:
      - 27017
    ports:
      - 27017:27017
volumes:
  mongo_volume: